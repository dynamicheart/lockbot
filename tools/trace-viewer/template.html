<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none';__TRACE_CONNECT_SRC__">
<title>LockBot · 轨迹浏览器</title>
<style>
:root{color-scheme:light;--ink:#14243b;--muted:#52647e;--line:#dfe7f0;--canvas:#f3f6fa;--paper:#fff;--soft:#f6f8fc;--accent:#215bc0;--selected:#e9f2ff;--sans:system-ui,"PingFang SC",sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 var(--sans)}
button,select{font:inherit;color:inherit}
button,summary{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p,pre{margin:0}
[hidden]{display:none!important}
.head{max-width:1568px;min-height:66px;margin:auto;padding:0 28px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.app-header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.brand{display:flex;gap:10px;align-items:center}
.mark{width:36px;height:36px;border-radius:10px;background:#edf5ff;display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
h1{font-size:17px;letter-spacing:-.02em}
.open-file,.quiet-button,.inspector-close,.chat-code button{border:1px solid #d5e0ee;background:white;border-radius:8px;font-size:12px;font-weight:650;padding:6px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.open-file{color:#234d8f;padding:7px 11px}
.icon{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
.open-file:hover,.quiet-button:not(:disabled):hover,.inspector-close:hover,.chat-code button:hover{background:var(--selected);border-color:#c7daf5}
.load-status{max-width:1568px;margin:auto;padding:0 28px 9px;color:#932d37;font-size:13px}
.load-status:empty{display:none}
.layout{max-width:1568px;margin:auto;padding:20px 28px 44px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.sidebar{position:sticky;top:86px;max-height:calc(100dvh - 106px);overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:7px 7px 9px}
.nav-heading{font-size:12px;font-weight:750;color:var(--ink);padding:9px 9px 5px}
.case-group h3{font-size:11px;font-weight:650;color:var(--muted);padding:6px 9px 3px}
.case-group+.case-group{margin-top:6px}
.case-runs{margin:3px 0 8px 14px;padding:1px 0 2px 8px;border-left:1px solid #cdd9ea}
.case-runs-heading{padding:4px 8px 2px;color:var(--muted);font-size:11px}
.case-runs .choice{min-height:30px;padding:5px 8px;font-size:12px}
.case-runs .choice[aria-pressed=true]{background:#edf3fd}
.choice{position:relative;display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 9px;min-height:35px;background:transparent;border:0;border-radius:7px;font-size:13px}
.choice:hover{background:var(--soft)}
.choice[aria-pressed=true]{background:var(--selected);color:#184b9d;font-weight:710}
.choice[aria-pressed=true]::before{content:"";width:2px;position:absolute;inset:7px auto 7px 0;background:var(--accent);border-radius:2px}
.model-name{overflow-wrap:anywhere}
.meta,.trace-ordinal,.trace-duration,.step-nav-count{font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{font-size:11px;color:var(--muted)}
.badge{display:inline-flex;gap:4px;align-items:center;padding:1px 6px;border-radius:5px;font-size:11px;font-weight:720;white-space:nowrap}
.pass{background:#e7f5ee;color:#146144}.timeout,.pending{background:#fff2da;color:#7b4b08}.blocked{background:#edf1f8;color:#365684}.fail{background:#fcebed;color:#952d38}
.mobile-pick{display:none}
#review{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:13px}
.run-overview{padding:20px 24px 0}
.case-header{position:relative;display:flex;justify-content:space-between;align-items:start;gap:12px}
.case-header h2{font-size:clamp(19px,2vw,26px);line-height:1.25;letter-spacing:-.025em;overflow-wrap:anywhere}
.run-header{display:flex;justify-content:space-between;align-items:baseline;gap:5px 14px;margin:9px 0 14px;flex-wrap:wrap}
.run-header h3{display:flex;align-items:center;gap:8px;font-size:14px;overflow-wrap:anywhere}
.counts{font-size:12px;color:var(--muted)}
.record-meta{font-size:12px;color:var(--muted)}
.record-meta summary{width:max-content;max-width:100%;margin-left:auto;padding:3px 0;white-space:nowrap}
.record-meta[open] dl{position:absolute;z-index:3;right:0;top:31px;width:min(100%,425px);border:1px solid var(--line);box-shadow:0 8px 24px #15294519;background:var(--paper)}
.record-meta dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 12px;background:var(--soft);border-radius:8px;margin:4px 0 0;padding:10px 12px;overflow-wrap:anywhere}
.record-meta dt{font-weight:650}
.record-meta dd{margin:0;white-space:pre-wrap}
#version{font-family:var(--mono)}
.tabs{display:flex;gap:21px;padding:0 24px;border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:6px;background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 2px;color:var(--muted);font-size:13px;font-weight:650}
.tab[aria-pressed=true]{border-bottom-color:var(--accent);color:#184b9d}
.timeline:not(.trace-view){max-width:1040px;margin:auto;padding:4px 28px 28px}
.session-label{margin:20px 0 16px;display:flex;align-items:center;gap:11px;color:var(--muted);font-size:12px;font-weight:720}
.session-label::after{content:"";height:1px;background:var(--line);flex:1}
.message{margin:0 0 17px;max-width:87%;width:fit-content;min-width:0}
.message.user{margin-left:auto;max-width:84%}
.role{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:baseline;font-weight:700;margin:0 2px 4px}
.user .role{justify-content:end}
.role small{font-size:11px;font-weight:500}
.bubble{padding:10px 13px;border:1px solid var(--line);background:var(--soft);border-radius:3px 11px 11px;overflow-wrap:anywhere;line-height:1.7}
.user .bubble{background:#eff5ff;border-color:#d9e6fa;border-radius:11px 3px 11px 11px}
.rich-text{white-space:pre-wrap}
.rich-text code{font: .89em var(--mono);background:#e8eef7;padding:2px 4px;border-radius:4px;color:#26496e}
.chat-code{margin:5px 0;border:1px solid #d8e3f1;background:#fff;border-radius:8px;overflow:hidden}
.chat-code-bar{padding:4px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#f4f7fc;color:var(--muted);font:11px var(--mono)}
.chat-code button{padding:2px 6px}
.chat-code pre{padding:9px 11px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 var(--mono)}
.missing,.human{color:#714b18;background:#fffaee;border:1px solid #f1e3c8;border-radius:8px;margin:12px 0;padding:7px 11px;font-size:13px}
.human{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.human span{font-size:12px}
.activity-group{margin:1px 0 17px 0;border:1px solid var(--line);border-radius:9px}
.activity-group summary{list-style:none;padding:8px 10px;display:grid;column-gap:8px;align-items:center;grid-template-columns:13px minmax(0,1fr);color:var(--muted);font-size:12px}
summary::-webkit-details-marker{display:none}
.activity-group summary:hover{background:var(--soft);border-radius:8px}
.activity-group summary::before,.evidence-section>summary::before{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);margin:0 2px}
.activity-group[open] summary::before,.evidence-section[open]>summary::before{transform:rotate(45deg) translateY(-2px)}
.activity-summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:680}
.activity-preview{grid-column:2;overflow-wrap:anywhere;font-size:11px;padding-top:3px}
.activity-failed{border-color:#edcbd2}
.activity-group ol{list-style:none;margin:0;padding:0 8px 7px}
.operation+.operation{margin-top:3px}
.inspect-step{border:0;background:var(--soft);border-radius:6px;padding:6px 8px;width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.inspect-step:hover{background:var(--selected)}
.step-failed{background:#fff5f6}
.step-open{color:var(--accent);white-space:nowrap}
.activity-action{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;overflow-wrap:anywhere}
.tool-status{font-size:11px;color:var(--muted)}
.trace-workspace{display:grid;grid-template-columns:clamp(204px,30%,330px) minmax(0,1fr);min-height:440px}
.trace-tree{min-width:0;align-self:start;position:sticky;top:66px;max-height:calc(100dvh - 66px);overflow:auto;scrollbar-width:thin;border-radius:0 0 0 13px}
.trace-toolbar{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:11px 12px;background:#fafbfd;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.trace-toolbar h3{font-size:12px;white-space:nowrap}
.trace-toggle{padding:3px 7px;font-size:11px}
.trace-toggle[aria-pressed=true]{background:#fcebed;color:#952d38;border-color:#f0cbd3}
.trace-session{display:flex;gap:6px;align-items:center;margin:10px 11px 4px;color:var(--muted);font-size:11px;font-weight:720}
.trace-actions{margin:0 7px 11px 17px;padding:0 0 0 8px;border-left:1px solid var(--line);list-style:none}
.trace-actions li{position:relative}
.trace-actions li::before{content:"";position:absolute;left:-9px;top:20px;width:8px;border-top:1px solid var(--line)}
.trace-row{background:transparent;border:0;border-radius:7px;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:start;width:100%;text-align:left;padding:6px 5px;margin:2px 0}
.trace-row:hover{background:var(--soft)}
.trace-row[aria-pressed=true]{background:var(--selected);color:#184b9d;box-shadow:inset 2px 0 var(--accent)}
.trace-icon{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#e8f1fd;color:#255591;flex:none}
.trace-icon.terminal{background:#e6f4ef;color:#1b6952}
.trace-icon.step-error{background:#fbe9ed;color:#9a3141}
.trace-row b{display:block;font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.trace-row small{display:block;font-size:10px;color:var(--muted);line-height:1.4;overflow-wrap:anywhere}
.trace-row .trace-ordinal{font-size:10px;color:var(--muted);padding-top:1px}
.trace-inspect{min-width:0;border-left:1px solid var(--line)}
.trace-inspect-header{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between;gap:9px}
.step-name{display:flex;gap:9px;align-items:start;min-width:0}
.step-name .trace-icon{margin-top:2px}
.trace-inspect-header h3,.inspector-header h2{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.trace-inspect-header p,.inspector-header p{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.step-nav{display:flex;align-items:center;gap:5px;flex:none}
.step-nav-count{font-size:11px;color:var(--muted);margin-right:2px}
.step-nav button{padding:4px}
.trace-inspect-body,.inspector-fields{padding:2px 17px 18px}
.evidence-section{margin:11px 0;font-size:13px}
.evidence-section>summary{list-style:none;display:flex;align-items:center;gap:9px;font-weight:720;padding:4px 0 7px}
.payload{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#f5f8fc}
.payload-body{max-height:46vh;overflow:auto;padding:11px 12px;scrollbar-width:thin}
.payload-text-key{font:11px/1.4 var(--mono);color:var(--muted);margin-bottom:6px;overflow-wrap:anywhere}
.payload-body .payload-text{color:var(--ink)}
.payload-body pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 var(--mono)}
.payload-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px;border-top:1px solid var(--line);background:#fff}
.payload-bar button{padding:3px 7px;color:var(--muted);background:#fff;border:1px solid transparent;border-radius:5px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
.payload-bar button:hover,.payload-bar button[aria-pressed=true]{background:var(--selected);color:#184b9d}
.payload-format{display:flex;gap:3px}
.payload-empty,.evidence-note,.empty-session{color:var(--muted);font-size:12px;padding:8px 12px}
.payload-empty{background:var(--soft);border-radius:7px}
.trace-inspect>.evidence-note{padding:24px 17px}
.format-label{font-size:11px;color:var(--muted);padding:0 5px}
.payload-error .payload{border-color:#edcbd2;background:#fff5f6}
.payload-body json-viewer{--background-color:transparent;--color:var(--ink);--font-family:var(--mono);--font-size:12px;--line-height:1.6;--property-color:#235d93;--string-color:#166447;--number-color:#865215;--boolean-color:#73437f;--null-color:#73437f;--preview-color:var(--muted);--indentguide-color:#d4dfed;--indentguide-color-active:#91add5}
.json-key{color:#235d93}.json-string{color:#166447}.json-number{color:#865215}.json-literal{color:#73437f}
.inspector{position:fixed;inset:0 0 0 auto;margin:0;width:min(550px,100%);max-width:100%;height:100dvh;max-height:none;padding:0;border:0;border-left:1px solid var(--line);background:#fff;color:var(--ink);box-shadow:-14px 0 42px #15294529}
.inspector[open]{display:flex;flex-direction:column;animation:inspector-in 150ms ease-out}
.inspector::backdrop{background:#17284355}
.inspector-header{display:flex;align-items:start;justify-content:space-between;gap:10px;padding:16px 17px;border-bottom:1px solid var(--line)}
.inspector-fields{min-height:0;overflow:auto}
@keyframes inspector-in{from{transform:translateX(12px);opacity:.85}to{transform:none;opacity:1}}
@media(max-width:900px){.layout{grid-template-columns:188px minmax(0,1fr);padding-inline:14px;gap:12px}.head{padding-inline:14px}.trace-workspace{grid-template-columns:minmax(168px,34%) minmax(0,1fr)}}
@media(max-width:720px){.app-header{position:static}.head{min-height:58px}.layout{padding:10px 10px 22px;display:block}.sidebar{display:none}.mobile-pick{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));padding:0 0 10px}.mobile-pick label{display:grid;gap:3px;color:var(--muted);font-size:11px}.mobile-pick select{width:100%;min-width:0;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px;font-size:12px}.run-overview{padding:13px 12px 0}.tabs{padding:0 12px}.timeline:not(.trace-view){padding:1px 12px 15px}.message,.message.user{max-width:95%}.trace-workspace{display:block;min-height:0}.trace-tree{position:static;max-height:238px;border-radius:0;border-bottom:1px solid var(--line)}.trace-inspect{border-left:0}.trace-inspect-header{padding:11px 12px}.trace-inspect-body{padding:0 12px 13px}.trace-inspect{scroll-margin-top:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Compact browsing workspace */
:root{--canvas:#f8fafc;--line:#e4e9f0;--muted:#66758a}
.head{min-height:52px;max-width:none;padding:0 18px}
.mark{width:29px;height:29px;background:transparent}
.head h1{font-size:14px}
.layout{max-width:none;padding:0;gap:0;grid-template-columns:212px minmax(0,1fr)}
.sidebar{border:0;border-right:1px solid var(--line);border-radius:0;background:#f8fafc;padding:10px 9px;gap:12px;top:52px;height:calc(100dvh - 52px);max-height:none}
#review{border:0;border-radius:0}
.run-overview{padding:14px 20px 0}
.case-header h2{font-size:19px}
.run-header{margin:7px 0 8px}
.run-header h3{font-size:13px}
.tabs{padding:0 20px;gap:20px;align-items:center}
.tab{padding:8px 0;font-size:12px}
.view-actions{margin-left:auto;display:flex;gap:5px}
.view-actions button{font-size:11px;padding:3px 7px}
.trace-workspace,.chat-workspace{grid-template-columns:252px minmax(0,1fr);min-height:0;height:100%}
.timeline.trace-view,.timeline.chat-workspace{padding:0;margin:0;max-width:none;min-height:0;overflow:hidden}
.chat-workspace{display:grid}
.trace-tree,.chat-outline{position:static;align-self:stretch;max-height:none;min-height:0;overflow:auto;background:#fafbfd;scrollbar-width:thin;border-radius:0}
.chat-outline{border-right:1px solid var(--line)}
.trace-inspect,.chat-transcript{overflow:auto;min-height:0;scrollbar-width:thin}
.trace-inspect-header{position:sticky;top:0;z-index:2;background:var(--paper);padding:12px 16px}
.trace-inspect-body{padding:0 16px 18px}
.trace-toolbar{padding:9px 12px}
.trace-search{position:sticky;top:38px;z-index:1;background:#fafbfd;padding:7px 10px;border-bottom:1px solid var(--line)}
.trace-search input{width:100%;border:1px solid #dbe3ef;border-radius:5px;padding:6px 8px;background:white;font:12px var(--sans);color:var(--ink)}
.trace-search input::placeholder{color:var(--muted)}
.trace-row{padding:7px 6px}
.trace-row b{font-size:12px;font-weight:600}
.trace-row small{font-size:11px;margin-top:2px}
.trace-session{margin-top:13px}
.trace-inspect-header h3{font-size:14px}
.evidence-section{margin:10px 0}
.payload-body{max-height:none;padding:12px;font-size:12px}
.payload-bar{position:sticky;top:0}
.payload{display:flex;flex-direction:column}
.payload-bar{order:-1;border-top:0;border-bottom:1px solid var(--line);background:#fafbfd}
.chat-transcript{padding:0 22px 22px;min-width:0}
.chat-transcript .session-label{margin:16px 0 13px;font-size:11px}
.chat-transcript .message,.chat-transcript .message.user{width:100%;max-width:100%;margin:0 0 14px;position:relative}
.chat-transcript .role{justify-content:start;font-size:11px;gap:8px;margin:0 0 5px}
.chat-transcript .role::before{content:"A";display:grid;place-items:center;width:20px;height:20px;border:1px solid #d8e5f5;border-radius:5px;background:#edf4ff;color:#30629b;font:700 10px var(--sans)}
.chat-transcript .user .role::before{content:"U";background:#f1f3f6;color:#66758a;border-color:#e1e6ee}
.chat-transcript .bubble{border:0;padding:0 0 0 28px;background:transparent;border-radius:0;font-size:13px;line-height:1.7}
.chat-transcript .user .bubble{background:#f5f7fa;padding:9px 12px;margin-left:28px;border:1px solid #e8edf3;border-radius:7px}
.chat-transcript .activity-group{margin:4px 0 16px 28px}
.chat-transcript .human,.chat-transcript .missing{margin-left:28px;font-size:12px}
.chat-transcript .activity-group summary{padding:7px 9px}
.outline-session{padding:10px 12px 4px;font-size:11px;color:var(--muted);font-weight:650}
.outline-row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:7px;align-items:start;width:calc(100% - 16px);margin:2px 8px;padding:7px 8px;border:0;background:transparent;border-radius:6px;text-align:left}
.outline-row:hover{background:#edf2f8}
.outline-row[aria-current=true]{background:#eaf2fe;box-shadow:inset 2px 0 #4079c9}
.outline-row .outline-glyph{font:700 10px var(--mono);display:grid;place-items:center;height:21px;border-radius:5px;color:#4b6c99;background:#eaf0f8}
.outline-row.outline-tools .outline-glyph{color:#2b7960;background:#e5f3ed}
.outline-row.outline-human .outline-glyph{color:#8b601d;background:#fcf0db}
.outline-row b{font-size:11px;font-weight:600;display:block}
.outline-row small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.5;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.outline-row strong{font-weight:inherit}
.browse-footer{border-top:1px solid var(--line);padding:5px 12px;font-size:10px;color:var(--muted);display:flex;gap:14px;background:#fafbfd;min-height:26px}
body.focus-mode .layout{grid-template-columns:minmax(0,1fr)}
body.focus-mode .sidebar{display:none}

<script>
let data = JSON.parse(document.getElementById('trace-data').textContent);
const statusNames = {pass:'通过',timeout:'超时',blocked:'环境阻塞',fail:'行为失败'};
const select = (id) => document.getElementById(id);
const node = (tag, text, className) => {
  const el = document.createElement(tag);
  if (text) el.textContent = text;
  if (className) el.className = className;
  return el;
};
const icons = {
  file:'M7 3h7l4 4v14H6V3h1m7 0v5h5M9 13h6m-6 4h6',
  chat:'M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.5-3A7.5 7.5 0 1 1 20 11.5Z',
  list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
  terminal:'m5 6 5 5-5 5m8 0h6',
  tool:'M5 6h14M5 12h14M5 18h9',
  error:'M12 8v5m0 3h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z',
  left:'m15 6-6 6 6 6',right:'m9 6 6 6-6 6',
};
function icon(name) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  const path = document.createElementNS(ns,'path');
  svg.setAttribute('class','icon'); svg.setAttribute('viewBox','0 0 24 24');
  svg.setAttribute('aria-hidden','true');
  path.setAttribute('d',icons[name]); path.setAttribute('fill','none');
  path.setAttribute('stroke','currentColor'); path.setAttribute('stroke-width','1.7');
  path.setAttribute('stroke-linecap','round'); path.setAttribute('stroke-linejoin','round');
  svg.append(path);
  return svg;
}
const roleNames = {user:'用户', assistant:'Agent'};
const scenarioLabels = {
  recover:'接入与凭证',create:'接入与凭证',reset:'接入与凭证','native-bind':'接入与凭证',
  native:'跨会话续用',preflight:'仓库指引与运维',workbench:'个人工作台',
};
function scenarioGroups() {
  const groups = new Map();
  for (const key of cases) {
    const label = data.groups && Object.hasOwn(data.groups,key) ? data.groups[key] :
      Object.hasOwn(scenarioLabels,key) ? scenarioLabels[key] : '';
    if (!groups.has(label)) groups.set(label,[]);
    groups.get(label).push(key);
  }
  return [...groups];
}
let cases = Object.keys(data.cases);
let activeCase, activeIndex, activeTab, activeStep, failureOnly;
let imported = false;
const online = location.pathname === '/dev/trace-review';
function defaultRun(key) {
  return key==='create' ? Math.max(0,data.cases[key].findIndex(run=>run.direct)) : 0;
}
function readRoute() {
  const route = new URLSearchParams(location.hash.slice(1));
  activeCase = cases.includes(route.get('case')) ? route.get('case') : cases.includes('create') ? 'create' : cases[0];
  activeIndex = Number(route.get('run') ?? defaultRun(activeCase));
  activeTab = route.get('view') === 'steps' ? 'events' : 'chat';
  activeStep = Number(route.get('step'));
  failureOnly = false;
}
function writeRoute() {
  const route = new URLSearchParams({case:activeCase,run:activeIndex});
  if (activeTab==='events') {
    route.set('view','steps');
    if (activeStep) route.set('step',activeStep);
  }
  history.replaceState(null,'','#'+route);
}
const caseName = key => data.labels && Object.hasOwn(data.labels,key) ? data.labels[key] || key : key;
const sessionName = index => '会话 ' + String(index+1).padStart(2,'0');
function badge(state) { return node('span',statusNames[state],'badge '+state); }
function resetSelection() { activeStep = 0; failureOnly = false; }
function pickCase(key) { activeCase = key; activeIndex = 0; resetSelection(); draw(); }
function pickRun(index) { activeIndex = index; resetSelection(); draw(); }
readRoute();
addEventListener('hashchange',()=>{readRoute(); draw();});
function choice(text, meta, pressed, action) {
  const button = node('button',null,'choice');
  button.type = 'button';
  button.setAttribute('aria-pressed',pressed);
  button.append(node('span',text,'model-name'));
  if (meta) button.append(meta);
  button.addEventListener('click',action);
  return button;
}
function modelLabel(trial,index) {
  return trial.model || '运行 '+String(index+1).padStart(2,'0');
}
function jsonPreview(value) {
  if (value && typeof value === 'object') return JSON.stringify(value,null,2);
  if (typeof value !== 'string' || !/^\s*[\[{]/.test(value) || value.length > 24000) return null;
  try { return JSON.stringify(JSON.parse(value),null,2); } catch { return null; }
}
function appendJson(code,text) {
  const tokens = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
  let cursor = 0;
  for (const match of text.matchAll(tokens)) {
    if (cursor < match.index) code.append(document.createTextNode(text.slice(cursor,match.index)));
    const type = match[2] ? 'key' : match[1] ? 'string' : match[3] ? 'literal' : 'number';
    code.append(node('span',match[0],'json-'+type));
    cursor = match.index + match[0].length;
  }
  code.append(document.createTextNode(text.slice(cursor)));
}
function displayText(value) {
  return typeof value === 'string' ? value : JSON.stringify(value,null,2);
}
async function copyText(text,button) {
  try {
    if (!navigator.clipboard) throw new Error('Clipboard unavailable');
    await navigator.clipboard.writeText(text);
  } catch {
    const textArea = node('textarea');
    textArea.value = text;
    textArea.style.cssText = 'position:fixed;opacity:0;inset:auto 0 0';
    (button.closest('dialog') ?? document.body).append(textArea);
    textArea.select();
    const copied = document.execCommand('copy');
    textArea.remove();
    button.focus();
    if (!copied) { button.textContent = '复制失败'; return; }
  }
  button.textContent = '已复制';
  setTimeout(()=>{button.textContent = '复制';},1200);
}
function evidenceField(label,value) {
  const field = node('details',null,'evidence-section');
  field.open = true;
  field.append(node('summary',label));
  if (value == null) {
    field.append(node('p','未采集','payload-empty'));
    return field;
  }
  const box = node('div',null,'payload');
  const body = node('div',null,'payload-body');
  const actions = node('div',null,'payload-bar');
  const raw = displayText(value);
  const json = jsonPreview(value);
  const formatted = json !== null && json.length <= 24000;
  const formats = node('div',null,'payload-format');
  const structured = value && typeof value==='object' ? value : formatted ? JSON.parse(json) : null;
  const entries = structured && !Array.isArray(structured) ? Object.entries(structured) : [];
  const [key,text] = entries.length===1 ? entries[0] : [];
  const reading = typeof text==='string' && text.includes('\n') ? [key,text] : null;
  if (formatted || reading) {
    const buttons = new Map();
    const render = mode=>{
      for (const [name,button] of buttons) button.setAttribute('aria-pressed',name===mode);
      if (mode==='text') {
        body.replaceChildren(node('p',reading[0],'payload-text-key'),node('pre',reading[1],'payload-text'));
      } else if (mode==='json' && customElements.get('json-viewer')) {
        const viewer = node('json-viewer');
        viewer.data = structured;
        body.replaceChildren(viewer);
      } else {
        const pre = node('pre');
        const code = node('code');
        if (mode==='json') appendJson(code,json);
        else code.textContent = raw;
        pre.append(code);
        body.replaceChildren(pre);
      }
      body.scrollTop = 0;
    };
    const options = [...(reading ? [['text','文本']] : []),...(formatted ? [['json','结构']] : []),['raw','原文']];
    for (const [mode,title] of options) {
      const button = node('button',title);
      button.type = 'button';
      button.onclick = ()=>render(mode);
      buttons.set(mode,button);
      formats.append(button);
    }
    render(reading ? 'text' : 'json');
  } else {
    body.append(node('pre',raw));
    formats.append(node('span',json===null?'文本':'JSON','format-label'));
  }
  const copy = node('button','复制');
  copy.type = 'button';
  copy.setAttribute('aria-label','复制'+label);
  copy.onclick = ()=>copyText(raw,copy);
  actions.append(formats,copy);
  box.append(body,actions);
  field.append(box);
  return field;
}
function renderStepEvidence(container,info) {
  if (!info) {
    container.replaceChildren(node('p','这条记录只保存了步骤概要。','payload-empty'));
    return;
  }
  const fields = [evidenceField('输入',info.input),evidenceField('输出',info.output)];
  if (info.error != null) {
    const error = evidenceField('错误',info.error);
    error.classList.add('payload-error');
    fields.push(error);
  }
  container.replaceChildren(...fields);
}
function isFailed(step,info) {
  return !!info?.error || /失败|错误|拒绝|拦截|超时|未成功/.test(step[3]);
}
function statusChip(step,info) {
  const status = step[3];
  return node('span',status || '异常','badge '+(isFailed(step,info) ? 'fail' :
    /待|进行/.test(status) ? 'pending' : 'blocked'));
}
function duration(info) {
  const ms = info?.duration_ms;
  if (!Number.isFinite(ms)) return null;
  return ms < 1000 ? ms+' ms' : Number((ms/1000).toFixed(2))+' s';
}
function stepLabel(step) { return step[1] || step[0] || '工具调用'; }
function stepGlyph(step,info) {
  const failed = isFailed(step,info);
  const glyph = /CLI|终端|Shell/i.test(step[0]) ? 'terminal' : /文档/.test(step[0]) ? 'file' : 'tool';
  const tile = node('span',null,'trace-icon '+(failed ? 'step-error' : glyph));
  tile.append(icon(failed ? 'error' : glyph));
  return tile;
}
function activityTitle(steps) {
  const types = new Map();
  for (const [tool] of steps) types.set(tool,(types.get(tool) ?? 0)+1);
  return [...types].map(([tool,count])=>tool+' '+count+' 次').join(' · ');
}
function openStep(step,info) {
  const [tool,,stage,status] = step;
  const inspector = select('inspector');
  select('inspector-title').textContent = stepLabel(step);
  const meta = select('inspector-meta');
  meta.replaceChildren();
  if (stage) meta.append(node('span',stage));
  if (tool) meta.append(node('span',tool));
  if (status || isFailed(step,info)) meta.append(statusChip(step,info));
  if (duration(info)) meta.append(node('span',duration(info),'trace-duration'));
  renderStepEvidence(select('inspector-fields'),info);
  select('inspector-fields').scrollTop = 0;
  inspector.showModal();
}
function stepList(steps,evidence=[]) {
  const list = node('ol');
  for (const [index,step] of steps.entries()) {
    const [tool,action,stage,status] = step;
    const line = node('li',null,'operation');
    const failed = isFailed(step,evidence[index]);
    const label = node('span',null,'activity-action');
    label.append(node('span',failed ? '!' : '·','activity-dot'),node('span',stepLabel(step)),
      node('span',[tool,status].filter(Boolean).join(' · '),'tool-status'));
    const info = evidence[index];
    if (info) {
      const button = node('button',null,'inspect-step');
      button.type = 'button';
      if (failed) button.classList.add('step-failed');
      button.setAttribute('aria-haspopup','dialog');
      button.append(label,node('span','详情 ›','step-open'));
      button.onclick = ()=>openStep(step,info);
      line.append(button);
    } else {
      line.append(label);
    }
    list.append(line);
  }
  return list;
}

function decodeEntities(text) {
  const decoder = document.createElement('textarea');
  return text.replace(/&(?:#\d+|#x[\da-f]+|[a-z][\da-z]+);/gi,entity=>{
    decoder.innerHTML = entity;
    return decoder.value;
  });
}
function codeBlock(text,language='') {
  const block = node('div',null,'chat-code');
  const bar = node('div',null,'chat-code-bar');
  const copy = node('button','复制');
  copy.type = 'button'; copy.setAttribute('aria-label','复制代码');
  copy.onclick = ()=>copyText(text,copy);
  bar.append(node('span',language || '代码'),copy);
  const pre = node('pre'), code = node('code');
  if (language.toLowerCase()==='json' && text.length<=24000 && jsonPreview(text)!==null) appendJson(code,text);
  else code.textContent = text;
  pre.append(code); block.append(bar,pre);
  return block;
}
function renderMarkdownTokens(target,tokens) {
  for (const token of tokens) {
    let el;
    switch (token.type) {
      case 'space': case 'def': continue;
      case 'html': target.append(node('span',token.raw,'md-literal')); continue;
      case 'code': target.append(codeBlock(token.text,token.lang?.split(/\s+/)[0])); continue;
      case 'codespan': target.append(node('code',token.text)); continue;
      case 'text': case 'escape':
        if (token.tokens) renderMarkdownTokens(target,token.tokens);
        else target.append(decodeEntities(token.text));
        continue;
      case 'paragraph': el=node('p'); break;
      case 'heading': el=node('h'+Math.min(6,Math.max(2,token.depth))); break;
      case 'blockquote': el=node('blockquote'); break;
      case 'strong': el=node('strong'); break;
      case 'em': el=node('em'); break;
      case 'del': el=node('del'); break;
      case 'br': target.append(node('br')); continue;
      case 'hr': target.append(node('hr')); continue;
      case 'link':
        // Display logged link text without inventing navigation actions.
        renderMarkdownTokens(target,token.tokens); continue;
      case 'image': target.append(node('span',token.text || token.raw)); continue;
      case 'list':
        el=node(token.ordered ? 'ol' : 'ul');
        if (token.ordered && Number.isInteger(token.start)) el.start=token.start;
        for (const item of token.items) {
          const li=node('li');
          if (item.task) {
            const check=node('input');
            check.type='checkbox';check.disabled=true;check.checked=!!item.checked;
            check.setAttribute('aria-label',item.checked ? '已完成' : '未完成');
            li.classList.add('md-task');li.append(check);
          }
          renderMarkdownTokens(li,item.tokens);
          el.append(li);
        }
        target.append(el);continue;
      case 'table': {
        const wrap=node('div',null,'md-table');
        wrap.tabIndex=0;wrap.setAttribute('role','region');wrap.setAttribute('aria-label','表格，可横向滚动');
        const table=node('table'),head=node('thead'),body=node('tbody');
        const row=(cells,header)=>{
          const tr=node('tr');
          for (const [i,cell] of cells.entries()) {
            const td=node(header?'th':'td');
            if (header) td.scope='col';
            if (['left','right','center'].includes(token.align[i])) td.style.textAlign=token.align[i];
            renderMarkdownTokens(td,cell.tokens);tr.append(td);
          }
          return tr;
        };
        head.append(row(token.header,true));

function messageBody(text) {

}
function renderEntry(entry) {
  if (entry.role === 'tools') {
    const failures = entry.steps.filter((step,i)=>isFailed(step,entry.evidence?.[i]));
    const details = node('details',null,'tool-box activity-group'+(failures.length ? ' activity-failed' : ''));
    const title = activityTitle(entry.steps);
    const summary = node('summary');
    const caption = node('span',title,'activity-summary');
    if (failures.length) caption.append(node('span',failures.length+' 项异常','badge fail'));
    const preview = (failures.length ? failures : entry.steps).slice(0,3).map(stepLabel).join('、');
    summary.append(caption,node('span','展开','activity-hint'),node('span',preview,'activity-preview'));
    details.append(summary,stepList(entry.steps,entry.evidence));
    details.open = failures.length > 0;
    const updateHint = ()=>{summary.querySelector('.activity-hint').textContent=details.open?'收起':'展开';};
    details.addEventListener('toggle',updateHint);
    updateHint();
    return details;
  }
  if (entry.role === 'human') {
    const event = node('div',null,'human');
    event.append(node('strong',entry.label || '用户操作'),node('span',entry.text));
    return event;
  }
  if (entry.role === 'missing') return node('p',entry.text,'missing');
  const message = node('div',null,'message '+entry.role);
  const role = node('p',roleNames[entry.role],'role');
  if (entry.label) role.append(node('small',entry.label));
  message.append(role,messageBody(entry.text));
  return message;
}
function chatView(content,trial) {

    const rendered = renderEntry(entry);
    transcript.append(rendered);

    button.type = 'button';
    button.setAttribute('aria-current','false');
    const label = entry.role==='tools' ? '工具调用 · '+entry.steps.length : roleNames[entry.role] || entry.label || '事件';

    button.append(node('span',entry.role==='tools' ? '›_' : entry.role==='user' ? 'U' : entry.role==='assistant' ? 'A' : '·','outline-glyph'),words);

      for (const pair of pairs) pair.button.setAttribute('aria-current',String(pair.button===button));
      transcript.scrollTop += rendered.getBoundingClientRect().top - transcript.getBoundingClientRect().top - 14;
      rendered.tabIndex = -1;

    };

  }

    if(index && trial.confirmed) appendEntry({role:'human',label:'群内确认',text:'由测试程序模拟 · 一次群操作'});
    transcript.append(node('p',sessionName(index),'session-label'));
    outline.append(node('p',sessionName(index),'outline-session'));

  if (trial.confirmed && trial.sessions.length===1) transcript.append(node('p','已记录模拟群内确认。新会话对话未采集。','human'));
  if (!pairs.length) transcript.append(node('p','没有对话记录','evidence-note'));

  content.append(outline,transcript);
  pairs[0]?.button.setAttribute('aria-current','true');

    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(()=>{
      scheduled = false;
      const edge = transcript.getBoundingClientRect().top+32;
      const current = pairs.find(pair=>pair.rendered.getBoundingClientRect().bottom>edge) ?? pairs.at(-1);
      for (const pair of pairs) pair.button.setAttribute('aria-current',String(pair===current));

function validRecord(record) {
  const optionalText = value => value == null || typeof value==='string';
  const optionalMap = value => value === undefined || (!!value && typeof value==='object' &&
    !Array.isArray(value) && Object.values(value).every(text=>typeof text==='string'));
  if (!record || record.schema !== 1 || !optionalText(record.title) || !optionalText(record.version) ||
    !record.cases || typeof record.cases !== 'object' || Array.isArray(record.cases) ||
    ![record.labels,record.criteria,record.groups].every(optionalMap)) return false;
  const runs = Object.values(record.cases);
  return runs.length && runs.every(list => Array.isArray(list) && list.length && list.every(run => run &&
      optionalText(run.model) && optionalText(run.note) &&
      (run.state == null || Object.hasOwn(statusNames,run.state)) && Array.isArray(run.sessions) &&
      run.sessions.every(session => Array.isArray(session) && session.every(entry => entry &&
        (entry.role === 'tools' ? Array.isArray(entry.steps) &&
          entry.steps.every(step => Array.isArray(step) && step.length === 4 && step.every(field=>typeof field==='string')) &&
          (entry.evidence === undefined || Array.isArray(entry.evidence)) :
          ['user','assistant','human','missing'].includes(entry.role) && typeof entry.text === 'string')))));
}

    lastSnapshot = '';
    layout.hidden = true;

  }

    if (imported) return;
    const token = localStorage.getItem('lockbot_token');
    if (currentToken !== token) {
      hideSnapshot();
      currentToken = token;
    }
    if (!token) {
      status.textContent = '请先登录 LockBot 超级管理员，再打开此页面。';
      return;
    }
    try {

        headers: {Authorization:'Bearer ' + token}, cache:'no-store', redirect:'error',
        signal:AbortSignal.timeout(6000)

      if (response.status === 401 || response.status === 403) {

        status.textContent = '仅已登录的超级管理员可查看在线结果。';
        return;
      }
      if (response.status === 404) {
        hideSnapshot();
        status.textContent = '等待首个测例结果。';
        return;

      if (imported || localStorage.getItem('lockbot_token') !== token) return;

        if (!validRecord(candidate)) throw new Error();
        lastSnapshot = snapshot;

        data = candidate;
        cases = Object.keys(data.cases);
        if (!cases.includes(activeCase)) activeCase = cases[0];
