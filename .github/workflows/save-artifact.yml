name: Save Image Artifact

on:
  workflow_run:
    workflows: ["Publish Docker Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.6.1)'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  save:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const old = artifacts.artifacts
              .filter(a => a.name.startsWith('lockbot-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(3); // keep latest 3
            console.log(`Found ${artifacts.artifacts.filter(a => a.name.startsWith('lockbot-')).length} artifacts, deleting ${old.length} old ones`);
            for (const a of old) {
              console.log(`Deleting: ${a.name} (${a.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id,
              });
            }

      - name: Pull and save image
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          IMAGE="ghcr.io/${{ github.repository }}:${TAG}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > "lockbot-${TAG}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: lockbot-${{ steps.tag.outputs.value }}
          path: lockbot-${{ steps.tag.outputs.value }}.tar.gz
          retention-days: 90
